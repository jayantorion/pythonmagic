# === DEFAULT SEED FACTS ===
# Used by Diff-Guard resume tailoring if no resume has been parsed yet.
# Each fact must have: fact_type, fact_value, verified (true/false)
default_facts:
  - fact_type: "skill"
    fact_value: "Your primary skill (years, proficiency level)"
    verified: true
  - fact_type: "skill"
    fact_value: "Another key skill (years, proficiency level)"
    verified: true
  - fact_type: "tool"
    fact_value: "Key tools/platforms you're proficient with"
    verified: true
  - fact_type: "experience"
    fact_value: "Notable achievement or experience (quantify if possible)"
    verified: true
  - fact_type: "education"
    fact_value: "Your highest degree and year"
    verified: true
  - fact_type: "certification"
    fact_value: "Relevant certifications (if any)"
    verified: true